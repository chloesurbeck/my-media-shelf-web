<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Media Shelf</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f5f3ff',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
            },
            dark: {
              900: '#090a0f',
              800: '#12141c',
              700: '#1a1d29',
              600: '#25293a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090a0f;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #12141c;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #25293a;
      border-radius: 3px;
    }
    .card-hover {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-40 bg-dark-900/90 backdrop-blur-md border-b border-dark-700/80 px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      
      <!-- Brand & Stats -->
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
          <i data-lucide="library" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
            Media Shelf
            <span id="admin-badge" class="hidden text-[10px] bg-brand-500/20 text-brand-400 border border-brand-500/30 px-2 py-0.5 rounded-full font-medium uppercase tracking-wider">Editor Mode</span>
          </h1>
          <p id="stats-counter" class="text-xs text-gray-400 font-medium">Loading collection...</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button id="btn-add-item" onclick="openAddModal()" class="hidden sm:flex items-center gap-1.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-md shadow-brand-600/20">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Add Title</span>
        </button>

        <!-- Admin / Phone Edit Toggle -->
        <button id="btn-admin-toggle" onclick="toggleAdminPrompt()" class="p-2 rounded-lg bg-dark-800 hover:bg-dark-700 text-gray-400 hover:text-white border border-dark-700 transition" title="Toggle Phone Editing Mode">
          <i id="admin-lock-icon" data-lucide="lock" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- CATEGORY NAVIGATION TABS (Horizontal scrolling for mobile) -->
    <div class="max-w-7xl mx-auto mt-3 overflow-x-auto custom-scrollbar pb-1">
      <div class="flex items-center gap-2 min-w-max" id="category-tabs">
        <!-- Tabs will be rendered dynamically -->
      </div>
    </div>

    <!-- SEARCH & STATUS FILTERS -->
    <div class="max-w-7xl mx-auto mt-3 flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center justify-between">
      <!-- Search input -->
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input 
          type="text" 
          id="search-input"
          placeholder="Search titles, directors, artists, genres..." 
          class="w-full bg-dark-800/80 border border-dark-700 focus:border-brand-500 rounded-xl pl-9 pr-8 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-brand-500 transition"
          oninput="handleSearch(this.value)"
        >
        <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white p-1">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- Quick status pills -->
      <div class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar pb-1 sm:pb-0" id="status-filters">
        <!-- Status filter buttons rendered here -->
      </div>
    </div>
  </header>

  <!-- MAIN MEDIA GRID -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-6">
    <!-- Items Grid -->
    <div id="media-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
      <!-- Cards rendered dynamically -->
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
      <div class="w-14 h-14 rounded-2xl bg-dark-800 border border-dark-700 flex items-center justify-center text-gray-500 mb-3">
        <i data-lucide="film" class="w-7 h-7"></i>
      </div>
      <h3 class="text-base font-semibold text-gray-300">No media found</h3>
      <p class="text-xs text-gray-500 mt-1 max-w-xs">Try adjusting your search query or switching active status filters.</p>
    </div>

    <!-- Infinite Scroll / Load More -->
    <div id="load-more-container" class="mt-8 flex justify-center pb-8">
      <button id="btn-load-more" onclick="loadMoreItems()" class="hidden bg-dark-800 hover:bg-dark-700 border border-dark-700 text-gray-300 text-xs font-semibold px-6 py-2.5 rounded-xl transition shadow">
        Load More Titles
      </button>
    </div>
  </main>

  <!-- DETAIL & EDIT MODAL -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/80 backdrop-blur-sm transition-opacity">
    <div class="bg-dark-800 border border-dark-700 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
      
      <!-- Modal Header with Image Banner -->
      <div class="relative h-44 sm:h-52 bg-dark-900 overflow-hidden flex items-center justify-center">
        <img id="modal-banner-bg" src="" alt="" class="absolute inset-0 w-full h-full object-cover blur-xl opacity-30">
        <div class="relative z-10 flex gap-4 p-4 items-end w-full h-full bg-gradient-to-t from-dark-800 to-transparent">
          <img id="modal-cover" src="" alt="" class="w-24 sm:w-28 aspect-[2/3] object-cover rounded-lg shadow-xl border border-dark-700 bg-dark-900 flex-shrink-0">
          <div class="flex-1 min-w-0 pb-1">
            <span id="modal-category-badge" class="text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider bg-brand-500/20 text-brand-300 border border-brand-500/30">Category</span>
            <h2 id="modal-title" class="text-lg sm:text-xl font-bold text-white leading-tight truncate mt-1.5">Title</h2>
            <p id="modal-subtitle" class="text-xs text-gray-300 font-medium truncate mt-0.5">Creator / Artist</p>
          </div>
        </div>
        <button onclick="closeModal()" class="absolute top-3 right-3 z-20 w-8 h-8 rounded-full bg-dark-900/80 text-gray-400 hover:text-white flex items-center justify-center backdrop-blur-md">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Modal Body (Details & Phone Edit Controls) -->
      <div class="p-5 overflow-y-auto custom-scrollbar flex-1 space-y-4">
        
        <!-- Editable / Display Fields -->
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-dark-700/50 p-2.5 rounded-xl border border-dark-700">
            <span class="text-[10px] text-gray-400 uppercase font-semibold block">Status</span>
            <span id="modal-status-view" class="text-xs font-semibold text-white mt-0.5 block">Watched</span>
            <select id="modal-status-edit" class="hidden w-full bg-dark-900 border border-dark-600 rounded text-xs text-white p-1 mt-1 focus:outline-none">
              <option value="Completed">Completed / Watched / Played / Read</option>
              <option value="In Progress">In Progress / Playing / Reading</option>
              <option value="Plan to Watch">Plan to Watch / Play / Read</option>
              <option value="Dropped">Dropped</option>
            </select>
          </div>

          <div class="bg-dark-700/50 p-2.5 rounded-xl border border-dark-700">
            <span class="text-[10px] text-gray-400 uppercase font-semibold block">Release Year</span>
            <span id="modal-year-view" class="text-xs font-semibold text-white mt-0.5 block">2020</span>
            <input type="text" id="modal-year-edit" class="hidden w-full bg-dark-900 border border-dark-600 rounded text-xs text-white p-1 mt-1 focus:outline-none">
          </div>

          <div class="bg-dark-700/50 p-2.5 rounded-xl border border-dark-700 col-span-2">
            <span class="text-[10px] text-gray-400 uppercase font-semibold block">Genre</span>
            <span id="modal-genre-view" class="text-xs font-semibold text-white mt-0.5 block">Action, Drama</span>
            <input type="text" id="modal-genre-edit" class="hidden w-full bg-dark-900 border border-dark-600 rounded text-xs text-white p-1 mt-1 focus:outline-none">
          </div>
        </div>

        <!-- Quick Toggles (Recommend, Favorite, Physical) -->
        <div class="flex items-center justify-between p-3 rounded-xl bg-dark-700/30 border border-dark-700">
          <div class="flex items-center gap-2">
            <button id="modal-fav-toggle" onclick="toggleModalProp('favorite')" class="flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-lg border border-dark-600 text-gray-400 transition hover:border-pink-500 hover:text-pink-400">
              <i data-lucide="heart" class="w-3.5 h-3.5"></i>
              <span id="modal-fav-text">Favorite</span>
            </button>
            <button id="modal-rec-toggle" onclick="toggleModalProp('recommend')" class="flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-lg border border-dark-600 text-gray-400 transition hover:border-yellow-500 hover:text-yellow-400">
              <i data-lucide="star" class="w-3.5 h-3.5"></i>
              <span id="modal-rec-text">Recommend</span>
            </button>
          </div>
          <span id="modal-physical-badge" class="hidden text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded font-semibold uppercase">Physical Copy</span>
        </div>

        <!-- External Link -->
        <div id="modal-link-container" class="hidden pt-1">
          <a id="modal-external-link" href="#" target="_blank" rel="noopener noreferrer" class="text-xs text-brand-400 hover:text-brand-300 flex items-center gap-1 font-medium">
            <span>View info / trailer on Wikipedia</span>
            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          </a>
        </div>
      </div>

      <!-- Modal Footer (Save Button for Admin Mode) -->
      <div id="modal-edit-footer" class="hidden p-4 border-t border-dark-700 bg-dark-900/80 flex items-center justify-between">
        <button onclick="deleteCurrentItem()" class="text-xs text-red-400 hover:text-red-300 font-semibold flex items-center gap-1">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete
        </button>
        <button onclick="saveModalChanges()" class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shadow-md shadow-brand-600/20">
          Save Changes
        </button>
      </div>
    </div>
  </div>

  <!-- FLOATING MOBILE ADD BUTTON (VISIBLE IN ADMIN MODE) -->
  <button id="btn-mobile-add" onclick="openAddModal()" class="hidden sm:hidden fixed bottom-6 right-6 z-30 w-12 h-12 rounded-full bg-brand-600 text-white shadow-xl flex items-center justify-center shadow-brand-600/40">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
